<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Bintang Frozen V27 - pencatatan operasional barang masuk, barang keluar, stok, transaksi, dan laporan." />
  <title>Bintang Frozen V27</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Buka menu">☰</button>
      <div class="brand"><img src="assets/icons/icon.svg" alt="" /><div><strong id="businessName">Bintang Frozen</strong><span>V27 Rebuild</span></div></div>
      <button class="icon-btn" id="refreshBtn" aria-label="Muat ulang data">↻</button>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="sidebar-head"><img src="assets/icons/icon.svg" alt="" /><div><strong>Bintang Frozen</strong><small>V27 Rebuild</small></div></div>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard">🏠 <span>Dashboard</span></a>
        <a href="#/incoming" data-route="incoming">📥 <span>Barang Masuk</span></a>
        <a href="#/outgoing" data-route="outgoing">📤 <span>Barang Keluar</span></a>
        <a href="#/stock" data-route="stock">📦 <span>Stok</span></a>
        <a href="#/transactions" data-route="transactions">📝 <span>Transaksi</span></a>
        <a href="#/reports" data-route="reports">📊 <span>Laporan</span></a>
        <a href="#/master" data-route="master">🗂️ <span>Master Data</span></a>
        <a href="#/settings" data-route="settings">⚙️ <span>Pengaturan</span></a>
      </nav>
      <div class="sidebar-foot"><span id="onlineState">● Online</span></div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main id="view" tabindex="-1">
      <section class="loading-screen"><div class="spinner"></div><p>Memuat Bintang Frozen V27…</p></section>
    </main>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="modalHost"></div>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
