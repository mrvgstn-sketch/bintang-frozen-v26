<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BINTANG FROZEN — V26</title>
  

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0d1b3e">
  <meta name="description" content="Bintang Frozen V26 - aplikasi operasional, tally, laporan dan audit berbasis cloud.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bintang Frozen">
  <link rel="icon" type="image/png" href="bintang-frozen-logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">


<script>document.documentElement.setAttribute("data-bf-auth-pending","1");</script>









  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-bf-build="20260812-advanced-clean-r4">

  <div id="bf-startup-screen" aria-live="polite">
    <div id="bf-startup-card">
      <div id="bf-startup-spinner"></div>
      <div style="font-size:18px;font-weight:900">BINTANG FROZEN — V26</div>
      <div id="bf-startup-message" style="margin-top:8px;font-size:12px;color:#dbe4f3">
        Memuat aplikasi...
      </div>
    </div>
  </div>

  <div id="root"></div>

<script id="bf-pre-react-guard" src="assets/js/pre-react-guard.js"></script>

<script src="assets/js/core.js"></script>
<script src="assets/js/schema-migrations.js"></script>
<script type="module" src="assets/js/react-app.js"></script>
  <script src="assets/js/legacy-anchor.js"></script>
  


<button id="bfV25Fab" title="Export PDF Gabungan Semua Laporan">📄 EXPORT PDF GABUNGAN</button>
<div id="bfV25Overlay" style="display:none">
  <div id="bfV25Modal">
    <div class="bf25-head">
      <div><div class="bf25-title">BINTANG FROZEN — V26 — TALLY SHEET PRO</div><div class="bf25-sub">Timbangan real per kolom • audit detail • offline local storage • siap cetak</div></div>
      <div class="bf25-actions">
        <button class="bf25-btn primary" id="bf25AddRow">＋ Baris</button>
        <button class="bf25-btn dark" id="bf25AddCol">＋ Kolom Real</button>
        <button class="bf25-btn" id="bf25Print">🖨 Cetak</button>
        <button class="bf25-btn" id="bf25Csv">⇩ CSV</button>
        <button class="bf25-btn primary" id="bf25Combined">⇩ Export Gabungan CSV</button><button class="bf25-btn dark" id="bf25CombinedPdf">📄 PDF Semua Laporan</button>
        <button class="bf25-btn" id="bf25Json">⇩ Backup JSON</button>
        <button class="bf25-btn danger" id="bf25Close">✕ Tutup</button>
      </div>
    </div>
    <div class="bf25-toolbar">
      <select id="bf25Mode" class="bf25-select"><option value="keluar">BARANG KELUAR</option><option value="masuk">BARANG MASUK</option></select>
      <input id="bf25Search" class="bf25-input" placeholder="Cari customer / supplier / item..." style="min-width:240px">
      <select id="bf25Filter" class="bf25-select"><option value="all">Semua</option><option value="filled">Ada timbangan</option><option value="empty">Belum ditimbang</option></select>
      <div class="bf25-kpi">
        <div class="bf25-card"><b id="bf25Rows">0</b><span>BARIS</span></div>
        <div class="bf25-card"><b id="bf25Count">0</b><span>TITIK TIMBANG</span></div>
        <div class="bf25-card"><b id="bf25Total">0,00 kg</b><span>TOTAL REAL</span></div>
        <div class="bf25-card"><b id="bf25Avg">0,00 kg</b><span>RATA-RATA</span></div>
      </div>
      <span style="margin-left:auto;font-size:9px;color:#64748b">Klik setiap angka R1/R2/... untuk membuka DETAIL TIMBANGAN.</span>
    </div>
    <div class="bf25-scroll"><table class="bf25-table"><thead id="bf25Thead"></thead><tbody id="bf25Tbody"></tbody></table></div>
  </div>
</div>
<div id="bfV25Detail">
  <div class="bf25-detailbox">
    <div class="bf25-detailhead" id="bf25DetailTitle">Detail Timbangan</div>
    <div class="bf25-detailbody">
      <div class="bf25-field"><label>Berat Real (kg)</label><input id="bf25DWeight" inputmode="decimal"></div>
      <div class="bf25-field"><label>Nomor Timbangan</label><input id="bf25DScale" placeholder="Timbangan 1"></div>
      <div class="bf25-field"><label>Operator</label><input id="bf25DOperator" placeholder="Nama petugas"></div>
      <div class="bf25-field"><label>Waktu Timbang</label><input id="bf25DTime" type="datetime-local"></div>
      <div class="bf25-field"><label>Gross (kg)</label><input id="bf25DGross" inputmode="decimal"></div>
      <div class="bf25-field"><label>Tare (kg)</label><input id="bf25DTare" inputmode="decimal"></div>
      <div class="bf25-field full"><label>Keterangan / Kondisi / Selisih</label><textarea id="bf25DNote" rows="3" placeholder="Contoh: kemasan basah, timbang ulang, selisih dengan surat jalan..."></textarea></div>
    </div>
    <div class="bf25-foot"><button class="bf25-btn" id="bf25CancelDetail">Batal</button><button class="bf25-btn primary" id="bf25SaveDetail">Simpan Detail</button></div>
  </div>
</div>
<script src="assets/js/tally-pro.js"></script>


<script id="bf-supabase-resilient-loader" src="assets/js/supabase-loader.js"></script>
<script src="assets/js/photo-storage.js"></script>
<script src="assets/js/cloud-sync.js"></script>

  <script src="assets/js/auth.js"></script>
<script id="bf-v26-professional-enhancements" src="assets/js/professional-enhancements.js"></script>

<script id="bf-final-menu-native-v26" src="assets/js/menu.js"></script>


<script id="bf-v26-governance-layer" src="assets/js/governance.js"></script>







<script id="bf-v26-operations-center" src="assets/js/operations.js"></script>



<script id="bf-v26-inline-tally-controller" src="assets/js/inline-tally.js"></script>



<script id="bf-v26-owner-control" src="assets/js/owner-control.js"></script>



<script id="bf-v26-finance-commission" src="assets/js/finance-commission.js"></script>










<script id="bf-v26-finance-master-crud" src="assets/js/finance-master.js"></script>
<script id="bf-v26-refresh-safe-bootstrap" src="assets/js/refresh-layout.js"></script>







<script id="bf-disable-legacy-pwa-cache" src="assets/js/pwa-cleanup.js"></script>
</body>
</html>
