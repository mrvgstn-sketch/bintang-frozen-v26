(function(){

      document.body.appendChild(p);
      p.querySelector("#bf-owner-users").onclick=()=>openUsers();
      p.querySelector("#bf-owner-perm").onclick=()=>openPermissions();
      p.querySelector("#bf-owner-audit").onclick=()=>openAudit();
      p.querySelector("#bf-owner-requests").onclick=()=>openRequests();
    }

    function modal(title,body,w=900){
      document.getElementById("bf-v27-modal")?.remove();
      const m=document.createElement("div");
      m.id="bf-v27-modal";
      m.innerHTML=`<div style="position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:15px">
        <div style="width:min(${w}px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px">
          <div style="padding:14px 17px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center">
            <b style="color:#0d1b3e">${esc(title)}</b>
            <button id="bf-v27-close" class="bf-v27-btn" style="background:#eef2f7">✕</button>
          </div>
          <div style="padding:16px">${body}</div>
        </div></div>`;
      document.body.appendChild(m);
      m.querySelector("#bf-v27-close").onclick=()=>m.remove();
      return m;
    }

    async function openAudit(){
      if(!has("view_audit")) return;
      const {data,error}=await sb.from("bf_audit_logs").select("*").order("created_at",{ascending:false}).limit(300);
      if(error){alert(error.message);return}
      const rows=(data||[]).map(x=>`<tr>
        <td>${esc(new Date(x.created_at).toLocaleString("id-ID"))}</td>
        <td>${esc(x.actor_email)}</td><td>${esc(x.actor_role)}</td><td>${esc(x.action)}</td>
        <td>${esc(x.entity_type||"")}</td>
        <td><details><summary>Detail</summary><pre style="font-size:10px;white-space:pre-wrap">${esc(JSON.stringify({before:x.before_data,after:x.after_data,metadata:x.metadata},null,2))}</pre></details></td>
      </tr>`).join("");
      modal("Log Aktivitas Admin & Operator",`<div style="overflow:auto"><table style="width:100%;font-size:11px;border-collapse:collapse">
        <thead><tr><th>Waktu</th><th>Pengguna</th><th>Role</th><th>Aktivitas</th><th>Data</th><th></th></tr></thead>
        <tbody>${rows||"<tr><td colspan=6>Belum ada aktivitas.</td></tr>"}</tbody></table></div>`);
    }

    async function openRequests(){
      if(!has("approve_history")) return;
      const {data,error}=await sb.from("bf_change_requests").select("*").order("created_at",{ascending:false}).limit(200);
      if(error){alert(error.message);return}
      const rows=(data||[]).map(x=>`<div style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:10px">
        <b>${esc(x.request_code)}</b> • <b>${esc(x.status)}</b>
        <div style="font-size:12px;color:#667085;margin:5px 0">${esc(x.requester_email)} • ${esc(x.requester_role)} • ${esc(new Date(x.created_at).toLocaleString("id-ID"))}</div>
        <div style="font-size:12px"><b>${esc(x.entity_type)} #${esc(x.entity_id)}</b><br>Alasan: ${esc(x.reason)}</div>
        <pre style="white-space:pre-wrap;background:#f8fafc;padding:8px;border-radius:8px;font-size:10px">${esc(JSON.stringify({before:x.before_data,after:x.after_data},null,2))}</pre>
        ${x.status==="pending"?`<button data-approve="${x.id}" class="bf-v27-btn" style="background:#059669;color:#fff;margin-right:6px">Setujui</button>
        <button data-reject="${x.id}" class="bf-v27-btn" style="background:#dc2626;color:#fff">Tolak</button>`:""}
      </div>`).join("");
      const m=modal("Permintaan Izin Perubahan Histori",rows||"<div>Belum ada permintaan.</div>",760);
      m.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>reviewRequest(b.dataset.approve,"approved"));
      m.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>reviewRequest(b.dataset.reject,"rejected"));
    }

    async function reviewRequest(id,status){
      const note=prompt(status==="approved"?"Catatan persetujuan (opsional):":"Alasan penolakan:");
      if(status==="rejected" && note===null) return;
      const {data,error}=await sb.from("bf_change_requests").update({
        status,reviewed_by:currentUser.id,reviewed_by_email:currentUser.email,
        reviewed_at:new Date().toISOString(),reviewer_note:note||""
      }).eq("id",id).select().single();
      if(error){alert(error.message);return}
      await audit(status==="approved"?"approve_history_change":"reject_history_change","change_request",id,null,data,{});
      openRequests();
    }

    async function openUsers(){
      if(!has("manage_users")) return;
      const {data,error}=await sb.from("bf_profiles").select("id,email,display_name,role,active,created_at").order("created_at");
      if(error){alert(error.message);return}
      const rows=(data||[]).map(x=>`<tr>
        <td>${esc(x.email)}</td><td>${esc(x.display_name||"")}</td>
        <td><select data-role="${x.id}" ${x.role==="owner"?"disabled":""}>
          <option value="admin" ${x.role==="admin"?"selected":""}>Admin</option>
          <option value="operator" ${x.role==="operator"?"selected":""}>Operator</option>
        </select></td>
        <td><input type="checkbox" data-active="${x.id}" ${x.active?"checked":""} ${x.role==="owner"?"disabled":""}></td>
        <td><button data-save="${x.id}" class="bf-v27-btn" style="background:#0d1b3e;color:#fff" ${x.role==="owner"?"disabled":""}>Simpan</button></td>
      </tr>`).join("");
      const m=modal("Kelola Pengguna",`<div style="overflow:auto"><table style="width:100%;font-size:11px">
        <thead><tr><th>Email</th><th>Nama</th><th>Role</th><th>Aktif</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        <div style="font-size:11px;color:#667085;margin-top:10px">Pengguna baru muncul setelah login Google pertama kali. Owner kemudian menetapkan role dan status aktif.</div>`,800);
      m.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.save, role=m.querySelector(`[data-role="${id}"]`).value, active=m.querySelector(`[data-active="${id}"]`).checked;
        const before=(data||[]).find(x=>x.id===id);
        const {data:after,error}=await sb.from("bf_profiles").update({role,active,updated_at:new Date().toISOString()}).eq("id",id).select().single();
        if(error){alert(error.message);return}
        await audit("update_user_access","user",id,before,after,{});
        openUsers();
      });
    }

    async function openPermissions(){
      if(!has("manage_permissions")) return;
      const roles=["admin","operator"];
      let html="";
      for(const role of roles){
        const p=await loadPermissions(role);
        html+=`<div style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:12px">
          <b>${role.toUpperCase()}</b>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;margin-top:9px">
          ${Object.entries(p).map(([k,v])=>`<label style="font-size:11px"><input type="checkbox" data-p="${role}:${k}" ${v?"checked":""}> ${esc(k)}</label>`).join("")}
          </div></div>`;
      }
      const m=modal("Pengaturan Hak Akses",html+`<button id="bf-save-perm" class="bf-v27-btn" style="background:#0d1b3e;color:#fff">Simpan Hak Akses</button>`,820);
      m.querySelector("#bf-save-perm").onclick=async()=>{
        for(const role of roles){
          for(const c of m.querySelectorAll(`[data-p^="${role}:"]`)){
            const permission=c.dataset.p.split(":")[1];
            const {error}=await sb.from("bf_role_permissions").upsert(
              {role,permission,allowed:c.checked,updated_at:new Date().toISOString()},
              {onConflict:"role,permission"});
            if(error){alert(error.message);return}
          }
        }
        await audit("update_permissions","role_permissions",null,null,null,{roles});
        alert("Hak akses disimpan.");
        m.remove();
      };
    }

    function isHistoryRow(row){
      if(!row) return false;
      if(row.locked===true) return true;
      const status=String(row.status||"").toLowerCase();
      if(["selesai","completed","closed","terkunci","locked"].includes(status)) return true;
      const date=row.tanggal||row.date||"";
      if(date){
        const d=new Date(date), today=new Date();
        if(!Number.isNaN(d.getTime())) {
          d.setHours(0,0,0,0); today.setHours(0,0,0,0);
          return d<today;
        }
      }
      return false;
    }

    async function requestHistoryChange(entityType,entityId,beforeData,afterData,reason){
      if(!currentUser || profile?.role==="owner") return true;

      // Jika Owner sudah menyetujui permintaan sebelumnya untuk item ini,
      // gunakan izin tersebut satu kali lalu tandai sebagai terpakai.
      const approved=await sb.from("bf_change_requests")
        .select("id,status,reviewer_note")
        .eq("requester_id",currentUser.id)
        .eq("entity_type",entityType)
        .eq("entity_id",String(entityId))
        .eq("status","approved")
        .is("consumed_at",null)
        .order("reviewed_at",{ascending:false})
        .limit(1)
        .maybeSingle();

      if(approved.data){
        const consume=await sb.rpc("bf_consume_change_request",{p_request_id:approved.data.id});
        if(consume.error || consume.data!==true){
          alert("Izin histori tidak dapat digunakan. Silakan minta persetujuan Owner kembali.");
          return false;
        }
        await audit("use_approved_history_permission",entityType,entityId,beforeData,afterData,{request_id:approved.data.id});
        return true;
      }

      const pending=await sb.from("bf_change_requests")
        .select("id").eq("requester_id",currentUser.id)
        .eq("entity_type",entityType).eq("entity_id",String(entityId))
        .eq("status","pending").limit(1).maybeSingle();

      if(pending.data){
        alert("Permintaan perubahan untuk data ini masih menunggu persetujuan Owner.");
        return false;
      }

      const code="REQ-"+Date.now().toString(36).toUpperCase();
      const {data,error}=await sb.from("bf_change_requests").insert({
        request_code:code,requester_id:currentUser.id,requester_email:currentUser.email||"",
        requester_role:profile.role,entity_type:entityType,entity_id:String(entityId),
        before_data:beforeData,after_data:afterData,reason,status:"pending"
      }).select().single();
      if(error){alert("Permintaan izin gagal: "+error.message);return false}
      await audit("request_history_change",entityType,entityId,beforeData,afterData,{request_id:data.id,reason});
      alert("Data histori terkunci. Permintaan perubahan telah dikirim ke Owner.");
      return false;
    }

    window.BFIsHistoryRow=isHistoryRow;
    window.BFRequestHistoryChange=requestHistoryChange;

    async function boot(){
      const {data:{session},error}=await sb.auth.getSession();
      if(error){showBlocking("Gagal memeriksa sesi login: "+error.message);return}

      if(!session){
        currentUser=null;profile=null;permissions={};
        localStorage.removeItem("bf_current_session_v24");
        document.getElementById("bf-owner-panel")?.remove();
        showBlocking();
        return;
      }

      const p=await loadProfile(session.user);
      if(!p || p.active!==true){
        await sb.auth.signOut({scope:"local"});
        localStorage.removeItem("bf_current_session_v24");
        showBlocking("Akun belum diaktifkan Owner. Hubungi Owner untuk mendapatkan akses.");
        return;
      }

      currentUser=session.user; profile=p; permissions=await loadPermissions(p.role);
      bridgeLegacySession();
      closeLogin();
      ownerPanel();
      await audit("login","session",currentUser.id,null,null,{});
      if(!sessionStorage.getItem("bf_v27_legacy_bridge")){
        sessionStorage.setItem("bf_v27_legacy_bridge","1");
        location.reload();
        return;
      }
      console.log("Bintang Frozen V27:",currentUser.email,p.role);
    }

    sb.auth.onAuthStateChange((event,session)=>{
      if(event==="SIGNED_OUT" || !session){
        currentUser=null;profile=null;permissions={};
        document.getElementById("bf-owner-panel")?.remove();
        if(!logoutInProgress) showBlocking();
      } else if(event==="SIGNED_IN" || event==="TOKEN_REFRESHED"){
        setTimeout(boot,0);
      }
    });

    // Guard tambahan untuk tombol fitur yang bisa dipetakan dengan ID/teks.
    document.addEventListener("click",function(e){
      if(!currentUser || !profile) return;
      const b=e.target?.closest?.("button");
      if(!b) return;
      const id=b.id||"", text=(b.textContent||"").trim().toLowerCase();
      const map=[
        [["bf25AddRow"],"add_row"],[["bf25AddCol"],"edit_data"],
        [["bf25Csv"],"export_csv"],[["bf25Combined"],"export_csv"],
        [["bf25CombinedPdf"],"export_pdf"],[["bf25Json"],"backup"],
        [["bf25Print"],"print"]
      ];
      for(const [ids,perm] of map){
        if(ids.includes(id) && !has(perm)){
          e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();
          alert("Akses ditolak. Izin ini belum diberikan Owner.");
          audit("permission_denied","feature",id,null,null,{permission:perm});
          return;
        }
      }
      if(text && !["logout","keluar"].includes(text)){
        // Log aktivitas UI yang jelas tanpa mencatat isi password atau data sensitif.
        if(/tambah|simpan|hapus|edit|cetak|export|backup|restore|timbang/i.test(text)){
          audit("ui_action","button",id||text,null,null,{label:text.slice(0,100)});
        }
      }
    },true);

    boot();
  })();
  </script>
<style id="bf-final-menu-style">
.bf-final-menu-wrap{position:relative;display:inline-flex;align-items:center}
.bf-final-menu-btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.bf-final-menu-btn:hover,.bf-final-menu-btn.bf-open{background:#fff;color:#0d1b3e}
.bf-final-menu-pop{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));max-height:72vh;overflow:auto;background:#fff;border:1px solid #e7ebf2;border-radius:16px;box-shadow:0 18px 45px rgba(13,27,62,.20);padding:12px;z-index:999999;display:none}
.bf-final-menu-pop.bf-show{display:block}
.bf-final-menu-head{font-size:11px;font-weight:900;color:#0d1b3e;padding:4px 6px 9px}
.bf-final-menu-section{border-top:1px solid #eef2f7;padding:10px 0 2px}
.bf-final-menu-label{font-size:9px;font-weight:900;letter-spacing:.08em;color:#64748b;text-transform:uppercase;padding:0 6px 6px}
.bf-final-menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bf-final-menu-item{border:1px solid #eef2f7;background:#f8fafc;border-radius:11px;padding:9px 10px;text-align:left;color:#0d1b3e;font-size:11px;font-weight:800;cursor:pointer}
.bf-final-menu-item:hover{background:#eef4ff;border-color:#d7e3ff}
.bf-final-menu-item small{display:block;color:#94a3b8;font-size:9px;font-weight:600;margin-top:2px;line-height:1.25}
@media(max-width:900px){.bf-final-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.bf-final-menu-pop{position:fixed;top:76px;left:10px;right:10px;transform:none;width:auto;max-height:78vh}.bf-final-menu-grid{grid-template-columns:1fr}}
</style>
<script id="bf-final-menu-script">
(function(){
  var hideLabels=['Barang Masuk','Barang Keluar','Masuk','Keluar','NOTE','KOMISI','💸 KOMISI','Staff','Pengaturan'];
  function clean(s){return String(s||'').replace(/\s+/g,' ').trim();}
  function norm(s){return clean(s).replace(/^💸\s*/,'').toLowerCase();}
  function findButton(label){
    var wanted=norm(label);
    var buttons=Array.prototype.slice.call(document.querySelectorAll('button'));
    return buttons.find(function(b){return norm(b.textContent)===wanted;});
  }
  function hideOld(){
    hideLabels.forEach(function(label){
      var b=findButton(label);
      if(b && !b.closest('.bf-final-menu-pop')) b.style.display='none';
    });
  }
  function go(label){
    var b=findButton(label);
    if(b){b.click();return true;}
    return false;
  }
  function install(){
    var dash=findButton('Dashboard'), hist=findButton('Histori');
    if(!dash || !hist) return;
    var nav=dash.parentElement;
    if(!nav) return;
    hideOld();
    if(nav.querySelector('.bf-final-menu-wrap')) return;

    var wrap=document.createElement('span');
    wrap.className='bf-final-menu-wrap';
    var btn=document.createElement('button');
    btn.type='button';
    btn.className='bf-final-menu-btn';
    btn.innerHTML='☰ <span>MENU</span> <span style="font-size:10px">▼</span>';

    var pop=document.createElement('div');
    pop.className='bf-final-menu-pop';
    pop.innerHTML=
      '<div class="bf-final-menu-head">Menu Bintang Frozen</div>'+
      '<div class="bf-final-menu-section"><div class="bf-final-menu-label">📦 Transaksi</div><div class="bf-final-menu-grid">'+
      '<button class="bf-final-menu-item" data-target="Barang Masuk">📥 Barang Masuk<small>Barang masuk & timbang</small></button>'+
      '<button class="bf-final-menu-item" data-target="Barang Keluar">📤 Barang Keluar<small>Barang keluar & timbang</small></button>'+
      '<button class="bf-final-menu-item" data-target="NOTE">📝 Note<small>Pengeluaran, setoran & sembako</small></button>'+
      '<button class="bf-final-menu-item" data-target="💸 KOMISI">💸 Komisi<small>Komisi marketing per KG</small></button>'+
      '</div></div>'+
      '<div class="bf-final-menu-section"><div class="bf-final-menu-label">📋 Data Master</div><div class="bf-final-menu-grid">'+
      '<button class="bf-final-menu-item" data-target="Barang Masuk">🚚 Supplier<small>Akses melalui Barang Masuk</small></button>'+
      '<button class="bf-final-menu-item" data-target="Barang Keluar">👥 Customer<small>Akses melalui Barang Keluar</small></button>'+
      '</div></div>'+
      '<div class="bf-final-menu-section"><div class="bf-final-menu-label">📊 Laporan</div><div class="bf-final-menu-grid">'+
      '<button class="bf-final-menu-item" data-target="Histori">📚 Histori<small>Riwayat transaksi</small></button>'+
      '<button class="bf-final-menu-item" data-action="pdf">📄 PDF<small>Semua laporan</small></button>'+
      '<button class="bf-final-menu-item" data-action="csv">📊 CSV<small>Export data</small></button>'+
      '<button class="bf-final-menu-item" data-action="print">🖨️ Cetak<small>Cetak laporan/tally</small></button>'+
      '</div></div>'+
      '<div class="bf-final-menu-section"><div class="bf-final-menu-label">🗂️ Lainnya</div><div class="bf-final-menu-grid">'+
      '<button class="bf-final-menu-item" data-action="backup">💾 Backup JSON<small>Cadangkan data</small></button>'+
      '</div></div>'+
      '<div class="bf-final-menu-section"><div class="bf-final-menu-label">⚙️ Pengelolaan Sistem</div><div class="bf-final-menu-grid">'+
      '<button class="bf-final-menu-item" data-target="Staff">👥 Staff<small>Pengguna & staff</small></button>'+
      '<button class="bf-final-menu-item" data-owner-action="users">👤 Pengguna<small>Kelola akun pengguna</small></button>'+
      '<button class="bf-final-menu-item" data-owner-action="permissions">🔐 Hak Akses<small>Atur izin Admin & Operator</small></button>'+
      '<button class="bf-final-menu-item" data-owner-action="audit">📋 Log Aktivitas<small>Aktivitas pengguna</small></button>'+
      '<button class="bf-final-menu-item" data-action="pdf">📄 Export PDF<small>Semua laporan</small></button>'+
      '<button class="bf-final-menu-item" data-owner-action="requests">🔔 Izin Histori<small>Persetujuan perubahan histori</small></button>'+
      '<button class="bf-final-menu-item" data-target="Pengaturan">⚙️ Pengaturan<small>Konfigurasi aplikasi</small></button>'+
      '</div></div>';

    wrap.appendChild(btn);
    wrap.appendChild(pop);
    nav.insertBefore(wrap,hist);

    function closeMenu(){pop.classList.remove('bf-show');btn.classList.remove('bf-open');}
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var open=!pop.classList.contains('bf-show');
      if(open){pop.classList.add('bf-show');btn.classList.add('bf-open');}else closeMenu();
    });
    pop.addEventListener('click',function(e){
      var item=e.target.closest('.bf-final-menu-item');
      if(!item) return;
      var ok=false;
      if(item.dataset.ownerAction){
        var ownerIds={users:"bf-owner-users",permissions:"bf-owner-perm",audit:"bf-owner-audit",requests:"bf-owner-requests"};
        var ownerBtn=document.getElementById(ownerIds[item.dataset.ownerAction]);
        if(ownerBtn){ownerBtn.click();ok=true;}
      }
      if(item.dataset.target) ok=go(item.dataset.target)||ok;
      if(item.dataset.action){
        var map={pdf:['PDF Semua Laporan','PDF'],csv:['Export Gabungan CSV','CSV'],print:['Cetak'],backup:['Backup JSON']};
        var list=map[item.dataset.action]||[];
        for(var i=0;i<list.length;i++){if(go(list[i])){ok=true;break;}}
      }
      if(ok) closeMenu();
    });
    document.addEventListener('click',function(e){if(!wrap.contains(e.target)) closeMenu();});
  }
  var observer=new MutationObserver(install);
  observer.observe(document.documentElement,{subtree:true,childList:true});
  setTimeout(install,500);
  setTimeout(install,1500);
  setTimeout(install,3000);
  setTimeout(install,6000);
})();
</script>
