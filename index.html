      <div class="bfTally-actions">
        <button class="bfTally-btn primary" id="bfTallyAddRow">＋ Baris</button>
        <button class="bfTally-btn dark" id="bfTallyAddCol">＋ Kolom Real</button>

        <div class="bfTally-card"><b id="bfTallyCount">0</b><span>TITIK TIMBANG</span></div>
        <div class="bfTally-card"><b id="bfTallyTotal">0,00 kg</b><span>TOTAL REAL</span></div>
        <div class="bfTally-card"><b id="bfTallyAvg">0,00 kg</b><span>RATA-RATA</span></div>
      </div>

<div id="bfTallyDetail">

      <div class="bfTally-field"><label>Nomor Timbangan</label><input id="bfTallyDScale" placeholder="Timbangan 1"></div>
      <div class="bfTally-field"><label>Operator</label><input id="bfTallyDOperator" placeholder="Nama petugas"></div>
      <div class="bfTally-field"><label>Waktu Timbang</label><input id="bfTallyDTime" type="datetime-local"></div>
      <div class="bfTally-field"><label>Gross (kg)</label><input id="bfTallyDGross" inputmode="decimal"></div>
      <div class="bfTally-field"><label>Tare (kg)</label><input id="bfTallyDTare" inputmode="decimal"></div>
      <div class="bfTally-field full"><label>Keterangan / Kondisi / Selisih</label><textarea id="bfTallyDNote" rows="3" placeholder="Contoh: kemasan basah, timbang ulang, selisih dengan surat jalan..."></textarea></div>
    </div>
    <div class="bfTally-foot"><button class="bfTally-btn" id="bfTallyCancelDetail">Batal</button><button class="bfTally-btn primary" id="bfTallySaveDetail">Simpan Detail</button></div>
