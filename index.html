<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bintang Frozen V26</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6f8;color:#18202a}header{background:#111827;color:white;padding:16px 20px;display:flex;gap:16px;align-items:center}header span{margin-left:auto}nav{display:flex;gap:7px;padding:10px;background:white;overflow:auto;position:sticky;top:0}button{border:0;border-radius:9px;padding:10px 13px;background:#111827;color:white;cursor:pointer}main{padding:20px;max-width:1400px;margin:auto}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:white;padding:18px;border-radius:14px;border:1px solid #e5e7eb}.stat b{font-size:28px;display:block}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(400px,100%)}input{width:100%;padding:12px;margin:7px 0;border:1px solid #d1d5db;border-radius:8px}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.wrap{overflow:auto}.muted{color:#64748b}</style></head><body><div id="login" class="login"><div class="card"><h1>BINTANG FROZEN V26</h1><p class="muted">Cloud ERP / Timbangan / Keuangan</p><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button style="width:100%" onclick="login()">Masuk</button><p id="msg"></p></div></div><div id="app" class="hidden"><header><b>BINTANG FROZEN <small>V26</small></b><span id="who"></span><button onclick="logout()">Keluar</button></header><nav><button onclick="page('dash')">Dashboard</button><button onclick="page('customers')">Customer</button><button onclick="page('products')">Produk</button><button onclick="page('suppliers')">Supplier</button><button onclick="page('stock')">Stok</button><button onclick="page('inbound')">Barang Masuk</button><button onclick="page('outbound')">Barang Keluar</button><button onclick="page('finance')">Keuangan</button><button onclick="page('commissions')">Komisi</button><button onclick="page('audit')">Audit</button><button onclick="pdf()">Export Gabungan PDF</button></nav><main><section id="dash"><h2>Dashboard</h2><div id="stats" class="grid"></div></section><section id="customers" class="hidden"><h2>Customer</h2><div id="customersData"></div></section><section id="products" class="hidden"><h2>Produk</h2><div id="productsData"></div></section><section id="suppliers" class="hidden"><h2>Supplier</h2><div id="suppliersData"></div></section><section id="stock" class="hidden"><h2>Stok</h2><div id="stockData"></div></section><section id="inbound" class="hidden"><h2>Barang Masuk + Timbangan</h2><div id="inboundData"></div></section><section id="outbound" class="hidden"><h2>Barang Keluar + Timbangan</h2><div id="outboundData"></div></section><section id="finance" class="hidden"><h2>Keuangan</h2><div id="financeData"></div></section><section id="commissions" class="hidden"><h2>Komisi Marketing</h2><div id="commissionData"></div></section><section id="audit" class="hidden"><h2>Audit Log</h2><div id="auditData"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
