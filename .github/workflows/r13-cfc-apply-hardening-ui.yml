name: R13 Apply Customer Funds Hardening UI

on:
  push:
    branches:
      - r13/customer-funds-control-20260822

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r13/customer-funds-control-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node tests/apply-r13-cfc-hardening-ui.js
      - name: Commit patch only when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/js/customer-funds-control.js; then
            echo "No UI patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/customer-funds-control.js
          git commit -m "R13: wire Customer Funds hardening controls into UI"
          git push origin HEAD:r13/customer-funds-control-20260822
