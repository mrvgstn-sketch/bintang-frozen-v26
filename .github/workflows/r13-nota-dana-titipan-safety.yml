name: R13 Nota Dana Titipan Safety

on:
  push:
    branches:
      - r13/nota-dana-titipan-uat-20260822
  pull_request:
    branches:
      - main

jobs:
  static-js:
    name: Static JS safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/js/menu.js
          node --check assets/js/nota-dana-titipan.js
      - name: Architecture guards
        run: |
          ! grep -E "bf_keluar_v26|bf_masuk_v26|inventory_movements|bf_state_items" assets/js/nota-dana-titipan.js
          ! grep -E "insert into public\.(bf_keluar|bf_masuk|bf_state_items)" supabase/migrations/20260822_r13_nota_dana_titipan*.sql
          grep -q "Kasir Pintar remains the canonical sales/POS writer" supabase/migrations/20260822_r13_nota_dana_titipan.sql
          grep -q "security_invoker=true" supabase/migrations/20260822_r13_nota_dana_titipan_hardening.sql
          grep -q "NT_PURE_ENTRUSTED_FEE_REQUIRED" supabase/migrations/20260822_r13_nota_dana_titipan.sql
          grep -q "NT_NOTE_NOT_PAID" supabase/migrations/20260822_r13_nota_dana_titipan_hardening.sql
          grep -q "NT_SELF_VERIFY_DENIED" supabase/migrations/20260822_r13_nota_dana_titipan.sql
      - name: Source snapshot SHA-256
        run: sha256sum assets/js/menu.js assets/js/nota-dana-titipan.js supabase/migrations/20260822_r13_nota_dana_titipan.sql supabase/migrations/20260822_r13_nota_dana_titipan_hardening.sql tests/r13-nota-dana-titipan.sql

  postgres-integration:
    name: PostgreSQL integration harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run functional, permission, idempotency and cash reconciliation tests
        working-directory: tests
        run: psql -h localhost -U postgres -d postgres -f r13-nota-dana-titipan.sql
