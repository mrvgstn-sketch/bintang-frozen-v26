name: R13 Nota Dana Titipan Safety

on:
  push:
    branches:
      - r13/nota-dana-titipan-uat-20260822
  pull_request:
    branches:
      - main

jobs:
  static-js:
    name: Static JS safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/js/menu.js
          node --check assets/js/schema-migrations.js
          node --check assets/js/setoran-canonical.js
          node --check assets/js/nota-dana-titipan.js
          node --check assets/js/nota-dana-titipan-controls.js
          node --check assets/js/nota-dana-titipan-signature-hardening.js
          node --check tests/r13-setoran-single-writer.js
      - name: Setoran single-writer logic
        run: node tests/r13-setoran-single-writer.js
      - name: Architecture guards
        run: |
          ! grep -E "bf_keluar_v26|bf_masuk_v26|inventory_movements|bf_state_items" assets/js/nota-dana-titipan.js assets/js/nota-dana-titipan-controls.js assets/js/nota-dana-titipan-signature-hardening.js
          ! grep -E "insert into public\.(bf_keluar|bf_masuk|bf_state_items)" supabase/migrations/20260822_r13_nota_dana_titipan*.sql
          grep -q "Kasir Pintar remains the canonical sales/POS writer" supabase/migrations/20260822_r13_nota_dana_titipan.sql
          grep -q "security_invoker=true" supabase/migrations/20260822_r13_nota_dana_titipan_hardening.sql
          grep -q "NT_PURE_ENTRUSTED_FEE_REQUIRED" supabase/migrations/20260822_r13_nota_dana_titipan.sql
          grep -q "NT_NOTE_NOT_PAID" supabase/migrations/20260822_r13_nota_dana_titipan_hardening.sql
          grep -q "NT_SELF_VERIFY_DENIED" supabase/migrations/20260822_r13_nota_dana_titipan.sql
          grep -q "payout_excess" supabase/migrations/20260822_r13_nota_dana_titipan_workflow_controls.sql
          grep -q "NT_REVERSE_PAYOUTS_FIRST" supabase/migrations/20260822_r13_nota_dana_titipan_workflow_controls.sql
          grep -q "CORRECTION_REQUIRED" supabase/migrations/20260822_r13_nota_dana_titipan_cash_hardening.sql
          grep -q "p_signature_strokes:strokeCount" assets/js/nota-dana-titipan-signature-hardening.js
          grep -q "NT_SIGNATURE_STROKES_REQUIRED" supabase/migrations/20260822_r13_nota_dana_titipan_signature_hardening.sql
          grep -q "BLOCKED non-canonical Setoran writer" assets/js/schema-migrations.js
          grep -q "window.BFSetoranStore" assets/js/schema-migrations.js
          grep -q "Customer ID stabil" assets/js/setoran-canonical.js
          grep -q "GAGAL / BELUM TERSINKRON" assets/js/setoran-canonical.js
          grep -q "loadCanonicalSetoran" assets/js/menu.js
          ! grep -q "'finance-deposit':'BFOpenFinanceDeposit'" assets/js/menu.js
          grep -q "bf_note_setoran_v26 remains the one canonical incoming-money writer" supabase/migrations/20260822_r13_customer_funds_foundation.sql
          grep -q "CUSTOMER_COMMISSION" supabase/migrations/20260822_r13_customer_funds_foundation.sql
          grep -q "CUSTOMER_DEPOSIT" supabase/migrations/20260822_r13_customer_funds_foundation.sql
          grep -q "WRONG_TRANSFER_REFUND" supabase/migrations/20260822_r13_customer_funds_foundation.sql
      - name: Source snapshot SHA-256
        run: sha256sum assets/js/menu.js assets/js/schema-migrations.js assets/js/setoran-canonical.js assets/js/nota-dana-titipan.js assets/js/nota-dana-titipan-controls.js assets/js/nota-dana-titipan-signature-hardening.js supabase/migrations/20260822_r13_nota_dana_titipan*.sql supabase/migrations/20260822_r13_customer_funds_foundation.sql tests/r13-nota-dana-titipan*.sql tests/r13-customer-funds-foundation.sql tests/r13-setoran-single-writer.js

  postgres-integration:
    name: PostgreSQL integration harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run core functional and permission tests
        working-directory: tests
        run: psql -h localhost -U postgres -d postgres -f r13-nota-dana-titipan.sql
      - name: Apply workflow control and signature migrations
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20260822_r13_nota_dana_titipan_workflow_controls.sql
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20260822_r13_nota_dana_titipan_cash_hardening.sql
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20260822_r13_nota_dana_titipan_signature_hardening.sql
      - name: Run mandatory signature tests
        working-directory: tests
        run: psql -h localhost -U postgres -d postgres -f r13-nota-dana-titipan-signature.sql
      - name: Run correction, reversal and stale-cash tests
        working-directory: tests
        run: psql -h localhost -U postgres -d postgres -f r13-nota-dana-titipan-workflow.sql
      - name: Apply Customer Funds foundation
        run: psql -h localhost -U postgres -d postgres -f supabase/migrations/20260822_r13_customer_funds_foundation.sql
      - name: Run Customer Funds foundation tests
        working-directory: tests
        run: psql -h localhost -U postgres -d postgres -f r13-customer-funds-foundation.sql
